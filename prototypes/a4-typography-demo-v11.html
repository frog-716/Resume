function setNumeric(k,e,min,max,mult=1){if(e.target.value==='')return;let n=Math.max(min,Math.min(max,Number(e.target.value)*mult));if(!Number.isFinite(n))return;n=k==='body'?Math.round(n):Math.round(n*2)/2;if(state[k]===n)return;mutate(()=>{state[k]=n;message='';});}
for(const[k,id,min,max,mult]of [['body','body-input',850,1050,100],['top','top-mm',0,30,1],['bottom','bottom-mm',0,30,1],['left','left-mm',0,30,1],['right','right-mm',0,30,1]]){$(id).onchange=e=>{setNumeric(k,e,min,max,mult);sync(true);};}
document.querySelectorAll('[data-margin]').forEach(b=>b.onclick=()=>{const k=b.dataset.margin,n=Math.max(0,Math.min(30,state[k]+Number(b.dataset.delta)));if(n!==state[k])mutate(()=>{state[k]=n;message='';});});document.querySelectorAll('[data-margin-pair]').forEach(b=>b.onclick=()=>{const delta=Number(b.dataset.marginPair);if(state.top+delta<0||state.bottom+delta<0||state.top+delta>30||state.bottom+delta>30)return;mutate(()=>{state.top+=delta;state.bottom+=delta;message='';});});
for(const[k,id]of [['auto','auto-fit'],['github','github-toggle'],['site','site-toggle']])$(id).onchange=e=>mutate(()=>{state[k]=e.target.checked;message='';});for(const[k,id]of [['paste','paste-mode'],['before','restore-before']])$(id).onchange=e=>mutate(()=>{state[k]=e.target.value;});$('view-mode').onchange=schedule;$('show-guides').onchange=schedule;

function fieldFrom(e){return e.target.closest?.('#paper-content [contenteditable]');}
$('paper-content').addEventListener('focusin',e=>{const el=fieldFrom(e);if(el){activeField=el;group=null;markPoint(el);$('bold').disabled=el.dataset.kind!=='body';$('delete-field').disabled=!el.matches('li');$('delete-experience').disabled=!el.closest('.experience');}});
$('paper-content').addEventListener('focusout',e=>{const el=fieldFrom(e);if(!el)return;if(composition)return;muting=true;el.innerHTML=cleanHTML(el);muting=false;schedule();});
$('paper-content').addEventListener('compositionstart',()=>{record();composition=true;group=null;});$('paper-content').addEventListener('compositionend',()=>{composition=false;schedule();});
$('paper-content').addEventListener('beforeinput',e=>{if(muting||composition||e.isComposing)return;const el=fieldFrom(e);if(!el)return;const now=Date.now(),type=e.inputType;if(!group||group.el!==el||group.type!==type||now-group.at>650)record();group={el,type,at:now};});
$('paper-content').addEventListener('input',()=>{message='';schedule();});
function current(){return activeField&&$('paper-content').contains(activeField)?activeField:null;}
function formatBold(){const el=current();if(!el||el.dataset.kind!=='body')return;mutate(()=>{el.focus();document.execCommand('bold');message='';});}
function align(value){const el=current();if(!el)return;mutate(()=>{el.style.setProperty('text-align',value,'important');if(!el.matches('li,h2'))el.style.display='block';message='';});}
function selectAll(el){el.focus();const r=document.createRange();r.selectNodeContents(el);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);}
function caret(el,end=true){el.focus();activeField=el;const r=document.createRange();r.selectNodeContents(el);r.collapse(!end);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);}
function splitEnter(el,shift){const sel=window.getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0);if(!el.contains(r.startContainer)||!el.contains(r.endContainer))return;mutate(()=>{if(shift){document.execCommand('insertLineBreak');return;}const pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);const post=document.createRange();post.selectNodeContents(el);post.setStart(r.endContainer,r.endOffset);const a=pre.cloneContents(),b=post.cloneContents();el.replaceChildren(a);const next=el.cloneNode(false);next.removeAttribute('id');next.append(b);el.after(next);caret(next,false);message='';});}
$('paper-content').addEventListener('keydown',e=>{if(e.isComposing)return;const el=fieldFrom(e);if(!el)return;activeField=el;const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();if(!mod&&['Delete','Backspace'].includes(e.key)&&deleteEmpty(el)){e.preventDefault();return;}if(e.key==='Enter'){e.preventDefault();if(el.dataset.kind==='body')splitEnter(el,e.shiftKey);else if(!e.shiftKey){const box=el.closest('.experience');if(box&&['entry','date'].includes(el.dataset.kind))addExperience(box);else el.blur();}return;}if(!mod)return;if(e.shiftKey&&['ArrowLeft','ArrowRight'].includes(e.key))return;if(['i','u','f'].includes(k)||e.shiftKey&&k==='z'){e.preventDefault();return;}if(k==='a'){e.preventDefault();selectAll(el);}else if(k==='b'){e.preventDefault();formatBold();}else if(!e.shiftKey&&['ArrowLeft','ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();align({ArrowLeft:'left',ArrowRight:'right',ArrowDown:'center'}[e.key]);}});
document.addEventListener('keydown',e=>{if(e.isComposing||!(e.metaKey||e.ctrlKey))return;const k=e.key.toLowerCase();if((k==='z'&&e.shiftKey)||['i','u','f'].includes(k)){e.preventDefault();return;}if(k==='a'&&!e.target.closest('[contenteditable],input,textarea')){e.preventDefault();return;}if(k==='z'&&!e.shiftKey){if(e.target.closest('.modal-box'))return;e.preventDefault();e.stopPropagation();undo();}else if(k==='s'){e.preventDefault();if($('version-modal').hidden)openVersion();}},true);
$('paper-content').addEventListener('paste',e=>{const el=fieldFrom(e);if(!el)return;e.preventDefault();const text=e.clipboardData.getData('text/plain').replace(/\r\n?/g,'\n');mutate(()=>{const sel=window.getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0);if(!el.contains(r.startContainer)||!el.contains(r.endContainer))return;if(el.dataset.kind!=='body'){document.execCommand('insertText',false,text.replace(/\n/g,' '));return;}if(state.paste==='lines'||!text.includes('\n')){document.execCommand('insertText',false,text);return;}const pre=r.cloneRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);const post=r.cloneRange();post.selectNodeContents(el);post.setStart(r.endContainer,r.endOffset);const parts=text.split('\n');el.innerHTML=cleanHTML(pre.cloneContents())+runs(parts[0]);let lastEl=el;for(const part of parts.slice(1)){const n=el.cloneNode(false);n.removeAttribute('id');n.innerHTML=runs(part);lastEl.after(n);lastEl=n;}lastEl.innerHTML+=cleanHTML(post.cloneContents());caret(lastEl);});});
for(const id of ['bold','add-bullet','delete-field','delete-experience'])$(id).onmousedown=e=>e.preventDefault();document.querySelectorAll('[data-align]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>align(b.dataset.align);});$('bold').onclick=formatBold;$('undo').onclick=undo;
$('add-bullet').onclick=()=>{const el=current();if(!el)return;mutate(()=>{let ul=el.closest('ul');if(!ul){const head=el.closest('.entry-head,.section-heading');ul=head?.nextElementSibling;if(!ul?.matches('ul'))return;}const n=document.createElement('li');n.dataset.kind='body';n.contentEditable='true';if(el.matches('li'))el.after(n);else ul.append(n);caret(n);});};$('delete-field').onclick=()=>{const el=current();if(!el?.matches('li'))return;mutate(()=>{const next=el.previousElementSibling||el.nextElementSibling||el.closest('.experience')?.querySelector('[contenteditable]');el.remove();markPoint(null);activeField=null;if(next)caret(next);message='已删除要点';});};$('delete-experience').onclick=()=>{const box=current()?.closest('.experience');if(!box)return;mutate(()=>{const next=box.previousElementSibling?.matches('.experience')?box.previousElementSibling:box.nextElementSibling?.matches('.experience')?box.nextElementSibling:null;box.remove();markPoint(null);activeField=null;if(next)caret(next.querySelector('[contenteditable]'));$('delete-experience').disabled=!current()?.closest('.experience');$('delete-field').disabled=!current()?.matches('li');message='已删除经历，可用⌘Z撤销';});};
function openVersion(){$('version-name').value='版本'+(versions.length+1);$('version-modal').hidden=false;$('version-name').focus();}
function versionView(){$('version-list').innerHTML=versions.length?versions.map((v,i)=>'<div class="version-row"><span>'+esc(v.name)+'</span><button data-restore="'+i+'">恢复</button><button data-delete="'+i+'">×</button></div>').join(''):'还没有版本';document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{pendingRestore=Number(b.dataset.restore);if(state.before==='ask')$('restore-modal').hidden=false;else restoreVersion(true);});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>mutate(()=>{trash.push(versions.splice(Number(b.dataset.delete),1)[0]);message='版本已放回收站';}));}
function restoreVersion(keep){const v=versions[pendingRestore];if(!v)return;mutate(()=>{if(keep)versions.push({name:'恢复前现稿',...paperSnapshot()});state={...v.state};$('paper-content').innerHTML=v.html;activeField=null;last=null;$('restore-modal').hidden=true;message='已恢复版本';});}
$('name-version').onclick=openVersion;$('cancel-version').onclick=()=>{$('version-modal').hidden=true;};$('confirm-version').onclick=()=>mutate(()=>{versions.push({name:$('version-name').value||'未命名版本',...paperSnapshot()});$('version-modal').hidden=true;message='内存版本已建立';});$('version-name').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('confirm-version').click();}};$('keep-before').onclick=()=>restoreVersion(true);$('discard-before').onclick=()=>restoreVersion(false);$('cancel-restore').onclick=()=>{$('restore-modal').hidden=true;};$('recover-version').onclick=()=>mutate(()=>{if(trash.length)versions.push(trash.pop());message='已恢复刚删除版本';});
$('save-current').onclick=()=>mutate(()=>{savedPaper=paperSnapshot();message='当前稿已存内存';});$('backup').onclick=()=>mutate(()=>{backupData={paper:paperSnapshot(),versions:structuredClone(versions),trash:structuredClone(trash),saved:savedPaper?structuredClone(savedPaper):null};message='内存备份已建立';});$('restore-backup').onclick=()=>{if(!backupData){message='还没有备份';schedule();return;}mutate(()=>{state={...backupData.paper.state};$('paper-content').innerHTML=backupData.paper.html;versions=structuredClone(backupData.versions);trash=structuredClone(backupData.trash);savedPaper=backupData.saved?structuredClone(backupData.saved):null;activeField=null;last=null;message='已从内存备份恢复';});};
async function fonts(){await document.fonts.ready;for(const[f,n]of [['PingFang SC','PingFangSC-Regular'],['Times New Roman','TimesNewRomanPSMT']])try{await new FontFace('Probe'+n,'local("'+n+'"),local("'+f+'")').load();}catch{fontMissing.push(f);}schedule();}
buildPaper();groupExperiences();sync();versionView();fonts();window.addEventListener('resize',schedule);
