<style>
*{box-sizing:border-box}
:root{color-scheme:light;--purple:#66439d;--ink:#26222d;--muted:#736a7e;--line:#e5dfeb;--paper-shadow:0 8px 30px #20182b20}
body{margin:0;background:#f4f2f6;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.shell{max-width:1380px;margin:0 auto;padding:18px 22px 36px}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px}
h1{font-size:21px;margin:0;font-weight:650}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:16px;display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 1px 2px #24183408}
.card h2{font-size:14px;margin:0 0 10px;font-weight:650}
.case-list{display:grid;gap:7px}

.metric:last-of-type{border-bottom:0;padding-bottom:0}

.section-heading{display:flex;align-items:center;gap:12px;margin:var(--section-gap) 0 5px}
.section-heading>span{font-size:calc(var(--section-pt)*1pt);line-height:1.25;font-weight:500;background:#424242;color:#fff;border-left:4px solid #deddda;border-radius:0 3px 3px 0;padding:4px 10px;min-width:90px;text-align:center}
.section-heading:after{content:"";flex:1;border-top:1px solid #bbb}
.identity+.section-heading{margin-top:4.5px}
.entry-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:3px 5px 4px;line-height:var(--head-line);align-items:start}
.entry-head.education{grid-template-columns:1fr 3fr 1fr}
.entry-head>[data-kind="entry"]{font-size:calc(var(--entry-pt)*1pt);line-height:var(--head-line);font-weight:700;min-width:0;overflow-wrap:anywhere}
.entry-head>[data-kind="entry"]:nth-child(2){text-align:center}
.entry-head.education>[data-kind="entry"]:nth-child(2){text-align:left}
.entry-head>[data-kind="date"]{font-size:calc(var(--entry-pt)*1pt);line-height:var(--head-line);font-weight:400;text-align:right;min-width:0;overflow-wrap:anywhere}
.experience{position:relative}
.bullets{padding:0 0 0 17px;margin:2px 0}
.bullets li{position:relative;list-style:none;font-size:calc(var(--body-pt)*1pt);line-height:var(--line-height);margin:var(--bullet-gap) 0;white-space:pre-wrap;overflow-wrap:anywhere}
.bullets li:before{content:"•";position:absolute;left:-13px;user-select:none;color:#424242}
.content-bottom{position:absolute;z-index:1;left:9mm;right:9mm;bottom:9mm;border-top:1px dashed #aa8ac2;pointer-events:none}
.paper.over:after{content:"";position:absolute;top:297mm;left:0;right:0;height:var(--overflow-px,0px);background:#fff0e9;pointer-events:none;opacity:.8}
.paper.over .content-bottom{border-color:#be7558}
.source-note{margin:10px 0 0;text-align:center;color:#756b80;font-size:11px}
.check-report{display:none;position:fixed;z-index:50;left:16px;right:16px;top:12px;max-height:35vh;overflow:auto;background:#fff;border:2px solid #3a7850;border-radius:10px;padding:10px 14px;box-shadow:0 5px 22px #0002;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
body.check-mode .check-report{display:block}

@media(max-width:520px){.side{grid-template-columns:1fr}.case-card,.result-card{grid-column:1}.case-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.case-button{padding:8px 6px}.case-button b{font-size:12px}.case-button small{font-size:10px}.metrics{grid-template-columns:1fr 1fr}.status{grid-column:1/-1}}
</style>

<body>
<div class="shell">
  <header class="top">
    <div><h1>看看字号和纸底空白</h1><p class="sub">点下面三种内容量，看同一套排版怎么变化。</p></div>
  </header>
  <div class="layout">
    <aside class="side">
      <section class="card case-card">
        <h2>选一份简历</h2>

 }

 let contentGrowthErrors=0;
 for(const mode of ['short','mixed','long'])for(let w=1;w<=3;w++)for(let p=1;p<=3;p++)for(let points=2;points<=5;points++)if(find(w,p,points,mode).body>find(w,p,points-1,mode).body)contentGrowthErrors++;
 for(const mode of ['short','mixed','long'])for(let p=1;p<=3;p++)for(let points=1;points<=5;points++)for(let w=2;w<=3;w++)if(find(w,p,points,mode).body>find(w-1,p,points,mode).body)contentGrowthErrors++;
 for(const mode of ['short','mixed','long'])for(let w=1;w<=3;w++)for(let points=1;points<=5;points++)for(let p=2;p<=3;p++)if(find(w,p,points,mode).body>find(w,p-1,points,mode).body)contentGrowthErrors++;
 let fitCount=0,overflow=0,maxFontCount=0,minFit=RULE.max;

 selectCase('usual');return {combinations:results.length,fitCount,overflow,maxFontCount,minFit,contentGrowthErrors,outOfRange,rangesOK,examples};
}
