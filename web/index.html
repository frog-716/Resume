<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>简历</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-area">
        <button class="resume-title" id="resume-title" type="button" aria-label="点击修改简历名称"></button>
        <span class="save-status" id="save-status" role="status">正在打开…</span>
      </div>
      <div class="top-actions">
        <button class="primary-button" id="export-pdf" type="button">导出 PDF</button>
      </div>
    </header>

    <main class="workspace" id="editor-view">
      <div class="paper-scroller" id="paper-scroller">
        <div class="paper-space" id="paper-space">
          <article class="paper" id="resume-paper" aria-label="简历编辑稿">
            <div class="paper-content" id="paper-content"></div>
            <div class="safe-zone" id="safe-zone" aria-hidden="true"></div>
            <div class="boundary" aria-hidden="true"><span>超页部分仍显示 · 暂停PDF</span></div>
          </article>
        </div>
      </div>
      <div class="view-controls" role="group" aria-label="纸张查看方式">
        <div class="view-segment">
          <button class="quiet-button view-button" id="view-page" type="button" aria-pressed="true">整页</button>
          <button class="quiet-button view-button" id="view-actual" type="button" aria-pressed="false">100%</button>
        </div>
        <button class="quiet-button guide-button" id="toggle-guide" type="button" aria-pressed="true"><span class="dashed-square" aria-hidden="true"></span>虚线框</button>
      </div>
    </main>

    <section class="library-view hidden" id="library-view" aria-label="简历收藏馆">
      <header class="library-header">
        <label class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input id="library-search" type="search" placeholder="搜索简历或快照" autocomplete="off" aria-label="搜索简历或快照"></label>
        <button class="icon-button trash-nav" id="show-trash" type="button" aria-label="打开废纸篓" title="废纸篓">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9 7V4.8h6V7m-8.4 0 1 13h8.8l1-13M10 10.2v6.8m4-6.8v6.8"/></svg>
        </button>
        <button class="primary-button small-primary" id="create-resume" type="button" aria-label="新建简历">＋</button>
      </header>
      <div class="library-grid" id="library-grid"></div>
    </section>

    <section class="trash-view hidden" id="trash-view" aria-label="废纸篓">
      <header class="trash-header">
        <button class="back-button" id="back-library" type="button">‹</button>
        <h1>废纸篓</h1>
        <label class="trash-search-wrap"><span aria-hidden="true">⌕</span><input id="trash-search" type="search" placeholder="搜索废纸篓" autocomplete="off" aria-label="搜索废纸篓"></label>
        <button class="text-button danger-text" id="empty-trash" type="button">清空</button>
      </header>
      <div class="library-grid" id="trash-grid"></div>
      <p class="empty-message hidden" id="trash-empty">废纸篓是空的</p>
    </section>
  </div>

  <button id="sort-handle" class="sort-handle" type="button" hidden aria-label="从这里三指拖动排序" title="在鼠标图上三指拖动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a6.5 6.5 0 0 0-6.5 6.5v4a6.5 6.5 0 0 0 13 0v-4A6.5 6.5 0 0 0 12 3.5Z"/><path d="M12 3.8v6.1M5.8 10h12.4"/><path d="M12 5.7v1.4" stroke-width="2.2"/></svg></button>

  <dialog class="modal" id="snapshot-dialog">
    <form method="dialog" id="snapshot-form">
      <h2>保存快照</h2>
      <label class="modal-label" for="snapshot-name">给这份快照起个名字</label>
      <input id="snapshot-name" name="name" maxlength="80" required autocomplete="off">
      <div class="modal-actions"><button class="quiet-button" value="cancel">取消</button><button class="primary-button" id="confirm-snapshot" value="save">保存</button></div>
    </form>
  </dialog>

  <dialog class="modal" id="confirm-dialog">
    <form method="dialog" id="confirm-form">
      <h2 id="confirm-title">请确认</h2>
      <p id="confirm-message"></p>
      <div class="modal-actions"><button class="quiet-button" value="cancel">取消</button><button class="primary-button danger-button" id="confirm-action" value="confirm">确认</button></div>
    </form>
  </dialog>

  <div class="toast hidden" id="toast" role="alert"></div>
</body>
</html>
