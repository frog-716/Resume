/* 与 V34 演示对齐：字体分轨（中文苹方／英文数字 Times）、GitHub 白猫、浮动添加菜单、
   固定排序手柄、超页边界线、焦点与占位样式。 */
.run-zh{font-family:"PingFang SC",sans-serif}
.run-en{font-family:"Times New Roman",serif}
.run-num{font-family:"Times New Roman",serif}
.github-cat{display:inline-block;flex:0 0 14px;width:14px;height:14px;color:#555}
.contact-add-menu{position:absolute;z-index:20;left:50%;top:calc(100% - 8px);transform:translateX(-50%);display:flex;gap:6px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease;background:#fff;border:1px solid #E3E1DC;border-radius:9px;padding:5px;box-shadow:0 5px 18px #23222A1A;white-space:nowrap}
.identity:hover .contact-add-menu,.identity:focus-within .contact-add-menu{opacity:1;visibility:visible;pointer-events:auto}
.contact-add-menu button{font-size:11px;padding:4px 8px;border-radius:6px}
.contact-add-menu button[hidden]{display:none}
/* 排序手柄只留一个鼠标图形：不再有白底方框/阴影/圆角。
   命中区就是鼠标的外切方形（17×19），指针进到这块小方形即可起拖，
   不需要先精准落在图形笔画上。定位在纸面左边距里、安全区虚线框外侧
   极小间隔处，不侵入正文（见 updateSortHandle/sortHandleLeft）。 */
.sort-handle{position:fixed;z-index:70;width:17px;height:19px;padding:0;display:grid;place-items:center;border:0;border-radius:0;background:transparent;box-shadow:none;color:#43414C;touch-action:none;user-select:none;cursor:grab}
.sort-handle[hidden]{display:none}
.sort-handle svg{width:15px;height:18.5px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sort-handle:hover{background:transparent;color:var(--accent)}
.sort-handle.is-dragging{opacity:.6;cursor:grabbing;pointer-events:none}
/* 拖动期：被拖条目就地变成"空位框"——内容隐藏但保留占位（不脱离布局），
   框上画虚线描边和提示；其余条目围着这个空位框实时重排（让位）。
   于是落点一眼可见：指针指向的那一行会往下让开，空位框停在它的位置上，
   松手这条就落进这个框里。不再用 2px 指示线——指示线说不清"替代的是哪一行"。 */
.sortable.drag-source{pointer-events:none}
.sortable.drag-source > *{visibility:hidden}
.sortable.drag-source::after{content:'';position:absolute;inset:0;border:2px dashed var(--accent);border-radius:6px;background:rgba(61,90,128,.07);pointer-events:none}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;opacity:.95;background:#fff;box-shadow:0 8px 24px #23222A29}
.boundary{position:absolute;top:297mm;left:0;right:0;border-top:2px solid #B3382F;z-index:4;display:none;pointer-events:none}
.boundary span{position:absolute;right:0;top:2px;background:#F7EAE8;color:#8C2F26;padding:2px 8px;font:12px/1.5 "PingFang SC",sans-serif;white-space:nowrap}
.paper.is-overflow .boundary{display:block}
.paper [contenteditable]:focus{outline:1px solid #3D5A80;background:#E9EEF4}
.contact-row.overflow{outline:1px solid #B3382F;background:#F7EAE8}
.paper [data-placeholder]:empty:before{content:attr(data-placeholder);color:#bbb;font-weight:400;pointer-events:none}
.paper .bullet[data-placeholder]:empty:before{content:attr(data-placeholder);color:#bbb;font-weight:400;pointer-events:none}
.experience-head .entry-field:nth-child(-n+2),.experience-head .entry-field:nth-child(-n+2) *{font-weight:700!important}
.experience-head .entry-field:nth-child(3),.experience-head .entry-field:nth-child(3) *{font-weight:400!important}

/* Chrome side panel overrides: compact chrome, unchanged A4 paper geometry. */
html, body, #app { min-width: 0; }
.app-shell { min-width: 0; }
body { overflow: hidden; }
.topbar { height: 54px; flex-basis: 54px; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; padding: 0 10px; gap: 8px; }
.brand-area { gap: 7px; min-width: 0; justify-self: start; }
.resume-title { max-width: 42vw; font-size: 16px; padding: 3px 0; }
.top-actions { gap: 4px; flex-wrap: nowrap; justify-self: end; }
.quiet-button, .primary-button, .icon-button, .back-button, .text-button { min-height: 32px; padding: 0 8px; border-radius: 8px; font-size: 12px; }
.top-actions .primary-button { min-width: 0; height: 34px; padding: 0 14px; font-size: 16px; font-weight: 700; white-space: nowrap; letter-spacing: .2px; }
.top-actions .quiet-button { white-space: nowrap; }
.paper-scroller { padding: 8px 8px 12px; }
.view-controls { gap: 2px; }
.view-controls .quiet-button { min-height: 30px; }
.view-controls .view-button { min-width: 48px; padding: 0 6px; }
/* 控件组左右两端的光学留白对齐：左侧 "−" 是定宽按钮内居中，
   字形左边距 = 组内边距 + 5px 内边距 + 约 3px 居中余量；右侧 "虚线框"
   文字贴边，所以这一侧补 7px 内边距，两端到边框的距离才一致。 */
.view-controls .guide-button { padding: 0 7px; }
.view-controls .dashed-square { width: 13px; height: 12px; }
.zoom-button { min-width: 28px; padding: 0 5px !important; font-size: 17px !important; }
.zoom-readout { min-width: 42px !important; padding: 0 4px !important; font-variant-numeric: tabular-nums; }
.zoom-input { min-width: 42px !important; padding: 0 4px !important; font-variant-numeric: tabular-nums; }
.library-view { padding: 10px; }
.library-header { gap: 6px; margin-bottom: 10px; }

  <script type="module">

/* ===== domain-resume-content.mjs ===== */
/**
 * Editable resume content owned by one resume document.
 *
 * `columns` are positional fields. Work and project entries use three fields;
 * education has one section-level three-field row with a fixed 1:3:1 ratio,
 * followed by its own section-level bullets. Editable text is stored as an
 * HTML fragment in an `html` property. The supported tags are b, strong, and br.
 */

const SECTION_ORDER = Object.freeze([
  "skills",
  "work",
  "projects",
  "education",
]);

const EDUCATION_COLUMN_RATIO = Object.freeze([1, 3, 1]);

const SECTION_TITLES = Object.freeze({
  skills: "专业技能",
  work: "工作经历",
  projects: "项目经历",
  education: "教育背景",
});

const OPTIONAL_LINK_TYPES = Object.freeze({
  github: "github",
  personalWebsite: "personalWebsite",
});

const text = (html = "") => ({ html });
const isRecord = (value) => value !== null && typeof value === "object" && !Array.isArray(value);

/** Return a fresh, blank content document. No nested state is shared. */
function createEmptyResumeContent() {
  return {
    identity: {
      name: text(),
      contacts: {
        phone: text(),
        email: text(),
        wechat: text(),
      },
      links: {
        github: null,
        personalWebsite: null,
      },
    },
    sections: [
      { type: "skills", title: text(SECTION_TITLES.skills), bullets: [] },
      { type: "work", title: text(SECTION_TITLES.work), entries: [] },
      { type: "projects", title: text(SECTION_TITLES.projects), entries: [] },
      {
        type: "education",
        title: text(SECTION_TITLES.education),
        columns: [text(), text(), text()],
        bullets: [],
      },
    ],
  };
}

/** Return a small fictional first-page example for UI development. */
function createSampleResumeContent() {
  const content = createEmptyResumeContent();

  content.identity.name = text("林舟");
  content.identity.contacts = {
    phone: text("010-0000-0000"),
    email: text("lin.zhou@example.com"),
    wechat: text("linzhou-demo"),
  };
  content.identity.links = {
    github: {
      type: "github",
      href: "https://example.com/lin-zhou",
      label: text("GitHub"),
    },
    personalWebsite: {
      type: "personalWebsite",
      href: "https://example.com/lin-zhou/profile",
      label: text("个人网页"),
    },
  };

  content.sections[0].bullets = [
    { id: "skill-1", html: "熟悉前端页面开发与组件拆分" },
    { id: "skill-2", html: "能用清晰的数据结构整理业务信息" },
    { id: "skill-3", html: "关注可读性、键盘操作与页面适配" },
  ];

  content.sections[1].entries = [
    {
      id: "work-entry-1",
      columns: [
        text("星桥科技（虚构）"),
        text("前端工程师"),
        text("2022.06—至今"),
      ],
      bullets: [
        { id: "work-bullet-1", html: "维护内部运营台，让常用操作更容易查找。" },
        { id: "work-bullet-2", html: "与设计和产品同事协作，整理页面状态与交互细节。" },
      ],
    },
  ];

  content.sections[2].entries = [
    {
      id: "project-entry-1",
      columns: [
        text("城市绿行数据看板（虚构）"),
        text("个人项目"),
        text("2024.01—2024.04"),
      ],
      bullets: [
        { id: "project-bullet-1", html: "把虚构的出行数据整理为可筛选的图表页面。" },
        { id: "project-bullet-2", html: "补充空数据和窄屏状态，方便演示不同使用场景。" },
      ],
    },
  ];

  content.sections[3].columns = [
    text("2018—2022"),
    text("海岚大学（虚构）· 信息管理"),
    text("杭州（虚构）"),
  ];
  content.sections[3].bullets = [
    { id: "education-bullet-1", html: "课程项目中整理虚构数据并制作展示说明。" },
  ];

  return content;
}

/**
 * Normalize a user-typed link into a value that is safe to store and to
 * render as a clickable link.
 *
 * D-03 allows a link row to exist before it is filled in, so an empty value
 * is a legitimate intermediate state and stays empty. Anything the user
 * types without a scheme gets `https://` so L-04 keeps the printed link
 * clickable. Script-bearing schemes are refused outright: the paper renders
 * the href on an <a>, so `javascript:` would be an injection vector.
 *
 * @param {string} raw
 * @returns {string} '' or an absolute http(s) URL
 */
function normalizeLinkHref(raw) {
  const text = String(raw ?? "").trim();
  if (!text) return "";
  if (/^(?:javascript|data|vbscript|file|blob):/i.test(text)) return "";
  if (/^https?:\/\//i.test(text)) return text;
  if (text.startsWith("//")) return `https:${text}`;
  if (/\s/.test(text)) return "";
  return `https://${text}`;
}

/**
 * Repair a resume content document so it can always be rendered and edited.
 *
 * The strict validator exists to protect the data model, but it must never be
 * used to *discard* a stored direction: dropping it would let the next save
 * overwrite the user's real content with an empty template. Instead this
 * function repairs what is safely repairable (missing sections, missing
 * arrays, missing ids, link schemes) and keeps everything else verbatim.
 *
 * @param {unknown} content
 * @returns {{content: object, repaired: boolean, issues: string[]}}
 */
function repairResumeContent(content) {
  const issues = [];
  const base = createEmptyResumeContent();
  if (!isRecord(content)) {
    issues.push("content 不是对象，已重置为空白简历。");
    return { content: base, repaired: true, issues };
  }

  const out = base;
  const identity = isRecord(content.identity) ? content.identity : {};
  const contacts = isRecord(identity.contacts) ? identity.contacts : {};
  for (const key of ["phone", "email", "wechat"]) {
    const value = contacts[key];
    if (isRecord(value)) out.identity.contacts[key] = { html: String(value.html ?? ""), ...(value.align ? { align: value.align } : {}) };
  }
  const name = identity.name;
  if (isRecord(name)) out.identity.name = { html: String(name.html ?? ""), ...(name.align ? { align: name.align } : {}) };

  const links = isRecord(identity.links) ? identity.links : {};
  for (const [key, expectedType] of Object.entries(OPTIONAL_LINK_TYPES)) {
    const link = links[key];
    if (link === null || link === undefined) { out.identity.links[key] = null; continue; }
    if (!isRecord(link)) {
      issues.push(`identity.links.${key} 结构不完整，已移除该链接。`);
      out.identity.links[key] = null;
      continue;
    }
    const rawHref = typeof link.href === "string" ? link.href : "";
    const href = normalizeLinkHref(rawHref);
    if (rawHref && !href) issues.push(`identity.links.${key} 的地址无法识别，已清空该链接。`);
    else if (rawHref && href !== rawHref) issues.push(`identity.links.${key} 的地址已补全协议。`);
    const label = isRecord(link.label) ? { html: String(link.label.html ?? "") } : { html: "" };
    out.identity.links[key] = { type: expectedType, href, label, ...(link.align ? { align: link.align } : {}) };
  }

  const seenIds = new Set();
  const takeId = (id, fallback) => {
    let next = typeof id === "string" && id.trim() ? id.trim() : fallback;
    while (seenIds.has(next)) next = `${next}-${Math.random().toString(36).slice(2, 7)}`;
    seenIds.add(next);
    return next;
  };
  const repairBullets = (bullets, prefix) => {
    if (!Array.isArray(bullets)) { if (bullets !== undefined) issues.push(`${prefix}.bullets 不是数组，已置空。`); return []; }
    return bullets.map((bullet, index) => {
      if (!isRecord(bullet)) return { id: takeId(null, `${prefix}-bullet-${index + 1}`), html: "" };
      return {
        id: takeId(bullet.id, `${prefix}-bullet-${index + 1}`),
        html: String(bullet.html ?? ""),
        ...(bullet.align ? { align: bullet.align } : {}),
      };
    });
  };
  const repairColumns = (columns) => {
    const list = Array.isArray(columns) ? columns : [];
    return [0, 1, 2].map((index) => {
      const column = list[index];
      if (!isRecord(column)) return { html: "" };
      return { html: String(column.html ?? ""), ...(column.align ? { align: column.align } : {}) };
    });
  };

  const sections = Array.isArray(content.sections) ? content.sections : [];
  const byType = new Map();
  for (const section of sections) if (isRecord(section)) byType.set(section.type, section);
  SECTION_ORDER.forEach((type, index) => {
    const source = byType.get(type);
    const target = out.sections[index];
    if (!source) { issues.push(`缺少 ${type} 板块，已补空板块。`); return; }
    if (isRecord(source.title)) target.title = { html: String(source.title.html ?? ""), ...(source.title.align ? { align: source.title.align } : {}) };
    if (type === "skills") target.bullets = repairBullets(source.bullets, `sections[${index}]`);
    else if (type === "education") {
      target.columns = repairColumns(source.columns);
      target.bullets = repairBullets(source.bullets, `sections[${index}]`);
    } else {
      const entries = Array.isArray(source.entries) ? source.entries : [];
      target.entries = entries.map((entry, entryIndex) => {
        if (!isRecord(entry)) return { id: takeId(null, `${type}-entry-${entryIndex + 1}`), columns: repairColumns([]), bullets: [] };
        return {
          id: takeId(entry.id, `${type}-entry-${entryIndex + 1}`),
          columns: repairColumns(entry.columns),
          bullets: repairBullets(entry.bullets, `sections[${index}].entries[${entryIndex}]`),
        };
      });
    }
  });

  return { content: out, repaired: issues.length > 0, issues };
}

/**
 * Validate a resume content document.
 *
 * Returns `{ valid, errors }`; each error names the field path that needs
 * attention. This validates content shape without imposing a persistence or
 * snapshot format.
 */
function validateResumeContent(content) {
  const errors = [];
  const seenIds = new Map();

  if (!isRecord(content)) {
    return { valid: false, errors: ["content must be an object."] };
  }

  validateIdentity(content.identity, errors);

  if (!Array.isArray(content.sections)) {
    errors.push('sections must be an array ordered as "skills", "work", "projects", "education".');
  } else {
    if (content.sections.length !== SECTION_ORDER.length) {
      errors.push(`sections must contain exactly ${SECTION_ORDER.length} blocks in the fixed order.`);
    }

    SECTION_ORDER.forEach((expectedType, index) => {
      const section = content.sections[index];
      const path = `sections[${index}]`;

      if (!isRecord(section)) {
        errors.push(`${path} must be an object of type "${expectedType}".`);
        return;
      }

      if (section.type !== expectedType) {
        errors.push(`${path}.type must be "${expectedType}"; received ${describe(section.type)}.`);
      }
      validateHtmlField(section.title, `${path}.title`, errors);

      if (expectedType === "skills") {
        validateBullets(section.bullets, `${path}.bullets`, errors, seenIds);
      } else if (expectedType === "work" || expectedType === "projects") {
        validateExperienceEntries(section.entries, `${path}.entries`, errors, seenIds);
      } else {
        validateColumns(section.columns, `${path}.columns`, errors);
        validateBullets(section.bullets, `${path}.bullets`, errors, seenIds);
      }
    });
  }

  return { valid: errors.length === 0, errors };
}

function validateIdentity(identity, errors) {
  if (!isRecord(identity)) {
    errors.push("identity must be an object containing name, contacts, and links.");
    return;
  }

  validateHtmlField(identity.name, "identity.name", errors);

  if (!isRecord(identity.contacts)) {
    errors.push("identity.contacts must be an object containing phone, email, and wechat fields.");
  } else {
    for (const key of ["phone", "email", "wechat"]) {
      validateHtmlField(identity.contacts[key], `identity.contacts.${key}`, errors);
    }
  }

    sameGroupBulletGapPt: 0.22 * bodyPt * (1 + 0.25 * slack),
    sectionBeforeGapPt: 0.60 * bodyPt * (1 + 0.30 * slack),

 * @param {number} options.availableHeightPx

    const key = `${bodyPt}:${slack}`;

    const height = measureContentHeightPx({

/**
 * Shared text-run splitting for resume fields.
 *
 * L-14: Chinese renders in PingFang SC; Latin letters and digits render in
 * Times New Roman. Splitting happens at render time only — stored HTML stays
 * plain text plus b/strong/br, so editing round-trips without migration.
 * Ported from the approved V34 prototype (prototypes/a4-spacing-eight-gaps-demo-v34.html).
 */

const ESCAPE_MAP = {
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
};

function escapeText(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ESCAPE_MAP[char]);
}

/** Return the text wrapped in run spans: Chinese in PingFang SC, Latin/digits in Times New Roman. */
function runsHtml(text) {
  const chars = Array.from(String(text ?? ''));
  const parts = [];
  let last = '';
  let buffer = '';
  for (let index = 0; index < chars.length; index += 1) {
    const char = chars[index];
    let kind;
    if (/[0-9]/.test(char)) kind = 'num';
    else if (/\p{Script=Latin}/u.test(char)) kind = 'en';
    else if (/[^\x00-\x7F]/.test(char)) kind = 'zh';
    else if (/[0-9]/.test(chars[index - 1] || '') || /[0-9]/.test(chars[index + 1] || '')) kind = 'num';
    else kind = last || 'en';
    if (kind !== last && buffer) {
      parts.push('<span class="run-' + last + '">' + escapeText(buffer) + '</span>');
      buffer = '';
    }
    buffer += char;
    last = kind;
  }
  if (buffer) parts.push('<span class="run-' + last + '">' + escapeText(buffer) + '</span>');
  return parts.join('');
}

function applyRunsToElement(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const targets = [];
  while (walker.nextNode()) {
    const node = walker.currentNode;
    if (!node.nodeValue) continue;
    const parent = node.parentElement;
    if (parent && parent.closest('.run-zh, .run-en, .run-num')) continue;
    targets.push(node);
  }
  for (const node of targets) {
    const fragment = document.createRange().createContextualFragment(runsHtml(node.nodeValue));
    node.parentNode.replaceChild(fragment, node);
  }

/** Re-split an edited field: unwrap existing run spans, then wrap again. */
function normalizeFieldRuns(element) {
  if (!element) return;
  element.querySelectorAll('.run-zh, .run-en, .run-num').forEach((span) => {
    span.replaceWith(...span.childNodes);
  });
  applyRunsToElement(element);
}

    const list = findBulletList(state.section, ids[0]);

function setView(view) {

  elements.directionView.classList.toggle('hidden', view !== 'directions');
  if (view !== 'editor') elements.sortHandle.hidden = true;
  if (view === 'directions') { renderDirections(); setTimeout(() => elements.directionSearch.focus(), 40); }
  else { updateSortHandle(); scheduleFit(); }
}
function renderDirections() {

  const ordered = [...storeState.directions].sort((a, b) => directionSortKey(b) - directionSortKey(a));

function directionSortKey(direction) {

}
function renderDirectionCard(direction) {

function updateCardScales() {

  elements.directionGrid.querySelectorAll('.card-paper-frame').forEach((frame) => {
    const mini = frame.querySelector('.card-paper');
    if (!mini) return;
    const scale = frame.clientWidth / PAPER_WIDTH_PX;
    mini.style.setProperty('--card-scale', String(scale));
    // S-07：缩略图要"保留超页内容"。默认 CSS 把相框锁成 210/297 且

async function openDirection(id) {
  const direction = findDirection(id); if (!direction) return;
  if (activeDirection?.id !== id && !(await saveNow())) return;

function toggleDirections() { setView(currentView === 'directions' ? 'editor' : 'directions'); }
function openDialog(dialog) { if (!dialog.open) dialog.showModal(); }
function confirmAction(message, title = '请确认', actionText = '确认') {
  elements.confirmTitle.textContent = title; elements.confirmMessage.textContent = message; elements.confirmAction.textContent = actionText; openDialog(elements.confirmDialog);
  return new Promise((resolve) => {
    const done = () => { elements.confirmDialog.removeEventListener('close', done); resolve(elements.confirmDialog.returnValue === 'confirm'); };
    elements.confirmDialog.addEventListener('close', done);
  });
}
function openCreateDirection() {
  elements.directionName.value = '';

  // Enter 也能续加，而不是给你一个啥都没有、加不了的空壳。
  const sampleOption = document.createElement('option');
  sampleOption.value = '__sample__';
  sampleOption.textContent = '示例模板（带示例内容 · 毛坯房）';
  elements.directionTemplate.replaceChildren(sampleOption, ...storeState.directions.map((direction) => { const option = document.createElement('option'); option.value = direction.id; option.textContent = direction.name; return option; }));

  openDialog(elements.directionDialog); elements.directionName.focus();
}
async function createDirection() {
  const name = elements.directionName.value.trim();
  const templateValue = elements.directionTemplate.value;
  const useSample = templateValue === '__sample__';
  const template = useSample ? null : (findDirection(templateValue) || activeDirection);
  if (!name || (!useSample && !template)) return;
  if (!(await saveNow())) return;
  const content = useSample ? createSampleResumeContent() : template.currentDraft.content;
  const layout = useSample ? DEFAULT_LAYOUT : template.currentDraft.layout;
  const direction = makeDirection(name, content, layout);

function openRenameDirection(id) {
  const direction = findDirection(id); if (!direction) return;
  pendingRenameId = id; elements.renameName.value = direction.name; openDialog(elements.renameDialog); elements.renameName.focus(); elements.renameName.select();
}
async function renameDirection(name) {
  const direction = findDirection(pendingRenameId); pendingRenameId = null; if (!direction || !name.trim()) return;
  const value = name.trim(); if (value === direction.name) return;

async function deleteDirection(id) {
  if (storeState.directions.length <= 1) { showToast('至少要保留一份简历方向。', 'error'); return; }
  const direction = findDirection(id); if (!direction) return;
  if (!await confirmAction(`“${direction.name}”会被永久删除，不能恢复。`, '删除简历方向', '删除')) return;
  const wasActive = activeDirection?.id === id;
  const index = storeState.directions.findIndex((item) => item.id === id);
  storeState.directions.splice(index, 1);
  if (wasActive) resetEditorState(storeState.directions[Math.min(index, storeState.directions.length - 1)]);

const PRINT_PAYLOAD_KEY = 'print-payload';
async function printPdf() {
  // PDF 是编辑器主动作。方向室视图下纸面是隐藏的（容器尺寸为 0）：此时测量
  // 只会得到垃圾结果，打印快照也会带上完全错误的布局，而用户看到的其实是
  // 方向室某张卡片、根本不是将要打印的那一页。先回到编辑页让用户确认内容，
  // 再点一次 PDF 才真正打印。
  if (currentView !== 'editor') {
    setView('editor');
    showToast('已返回编辑页，请再次点击 PDF 打印当前方向。');
    return;
  }
  // Re-measure immediately so a click made during the autosave debounce cannot
  // print a stale layout decision.
  applyAutoFit();

  if (!(await saveNow())) return;
  // Chrome 侧边栏是受限渲染面，window.print() 不可靠（Chromium 已知缺陷）。
  // 改为把当前已适配好的纸面快照交给独立打印页，在真实标签页里打印：
  // 输出与侧边栏所见一致，A4 与 @media print 规则稳定生效。
  const paper = elements.paper.cloneNode(true);

    element.removeAttribute('contenteditable');
    element.removeAttribute('data-edit');
    element.removeAttribute('data-placeholder');
  });

  paper.querySelectorAll('.safe-zone,.boundary,.empty-section-hint').forEach((element) => element.remove());

    await extensionStorageSet(PRINT_PAYLOAD_KEY, { html: paper.outerHTML, name: activeDirection?.name || '简历' });
    await chrome.tabs.create({ url: chrome.runtime.getURL('print.html') });
  } catch (error) {
    showToast(`打开打印页失败：${error.message}`, 'error');

}
function installEvents() {
  elements.paperContent.addEventListener('keydown', onEditorKeydown);
  elements.paperContent.addEventListener('paste', onPaste);
  elements.paperContent.addEventListener('beforeinput', onBeforeInput);
  elements.paperContent.addEventListener('input', onInput);
  elements.paperContent.addEventListener('compositionstart', onCompositionStart);
  elements.paperContent.addEventListener('compositionend', onCompositionEnd);
  elements.paperContent.addEventListener('compositioncancel', onCompositionCancel);

  elements.paperContent.addEventListener('focusout', onFocusOut);

async function boot() {
