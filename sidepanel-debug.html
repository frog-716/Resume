/* 与 V34 演示对齐：字体分轨（中文苹方／英文数字 Times）、GitHub 白猫、浮动添加菜单、
   固定排序手柄、超页边界线、焦点与占位样式。 */
.run-zh{font-family:"PingFang SC",sans-serif}
.run-en{font-family:"Times New Roman",serif}
.run-num{font-family:"Times New Roman",serif}
.github-cat{display:inline-block;flex:0 0 14px;width:14px;height:14px;color:#555}
.contact-add-menu{position:absolute;z-index:20;left:50%;top:calc(100% - 8px);transform:translateX(-50%);display:flex;gap:6px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease;background:#fff;border:1px solid #E3E1DC;border-radius:9px;padding:5px;box-shadow:0 5px 18px #23222A1A;white-space:nowrap}
.identity:hover .contact-add-menu,.identity:focus-within .contact-add-menu{opacity:1;visibility:visible;pointer-events:auto}
.contact-add-menu button{font-size:11px;padding:4px 8px;border-radius:6px}
.contact-add-menu button[hidden]{display:none}
/* 排序手柄只留一个鼠标图形：不再有白底方框/阴影/圆角。
   命中区就是鼠标的外切方形（17×19），指针进到这块小方形即可起拖，
   不需要先精准落在图形笔画上。定位在纸面左边距里、安全区虚线框外侧
   极小间隔处，不侵入正文（见 updateSortHandle/sortHandleLeft）。 */
.sort-handle{position:fixed;z-index:70;width:17px;height:19px;padding:0;display:grid;place-items:center;border:0;border-radius:0;background:transparent;box-shadow:none;color:#43414C;touch-action:none;user-select:none;cursor:grab}
.sort-handle[hidden]{display:none}
.sort-handle svg{width:15px;height:18.5px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sort-handle:hover{background:transparent;color:var(--accent)}
.sort-handle.is-dragging{opacity:.6;cursor:grabbing;pointer-events:none}
/* 拖动期：被拖条目就地变成"空位框"——内容隐藏但保留占位（不脱离布局），
   框上画虚线描边和提示；其余条目围着这个空位框实时重排（让位）。
   于是落点一眼可见：指针指向的那一行会往下让开，空位框停在它的位置上，
   松手这条就落进这个框里。不再用 2px 指示线——指示线说不清"替代的是哪一行"。 */
.sortable.drag-source{pointer-events:none}
.sortable.drag-source > *{visibility:hidden}
.sortable.drag-source::after{content:'';position:absolute;inset:0;border:2px dashed var(--accent);border-radius:6px;background:rgba(61,90,128,.07);pointer-events:none}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;opacity:.95;background:#fff;box-shadow:0 8px 24px #23222A29;will-change:transform;transform-origin:center}
.boundary{position:absolute;top:297mm;left:0;right:0;border-top:2px solid #B3382F;z-index:4;display:none;pointer-events:none}
.boundary span{position:absolute;right:0;top:2px;background:#F7EAE8;color:#8C2F26;padding:2px 8px;font:12px/1.5 "PingFang SC",sans-serif;white-space:nowrap}
.paper.is-overflow .boundary{display:block}
.paper [contenteditable]:focus{outline:1px solid #3D5A80;background:#E9EEF4}
.contact-row.overflow{outline:1px solid #B3382F;background:#F7EAE8}
.paper [data-placeholder]:empty:before{content:attr(data-placeholder);color:#bbb;font-weight:400;pointer-events:none}
.paper .bullet[data-placeholder]:empty:before{content:attr(data-placeholder);color:#bbb;font-weight:400;pointer-events:none}
.experience-head .entry-field:nth-child(-n+2),.experience-head .entry-field:nth-child(-n+2) *{font-weight:700!important}
.experience-head .entry-field:nth-child(3),.experience-head .entry-field:nth-child(3) *{font-weight:400!important}

/* Chrome side panel overrides: compact chrome, unchanged A4 paper geometry. */
html, body, #app { min-width: 0; }
.app-shell { min-width: 0; }
body { overflow: hidden; }
.topbar { height: 54px; flex-basis: 54px; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; padding: 0 10px; gap: 8px; }
.brand-area { gap: 7px; min-width: 0; justify-self: start; }
.resume-title { max-width: 42vw; font-size: 16px; padding: 3px 0; }
.top-actions { gap: 4px; flex-wrap: nowrap; justify-self: end; }
.quiet-button, .primary-button, .icon-button, .back-button, .text-button { min-height: 32px; padding: 0 8px; border-radius: 8px; font-size: 12px; }
.top-actions .primary-button { min-width: 0; height: 34px; padding: 0 14px; font-size: 16px; font-weight: 700; white-space: nowrap; letter-spacing: .2px; }
.top-actions .quiet-button { white-space: nowrap; }
.paper-scroller { padding: 8px 8px 12px; }
/* 顶栏两个控件的高度必须一致：PDF 是 34px 定高，而控件组原本是
   「3px 上下内边距 + 30px 按钮 + 1px 边框 = 38px」，比它高 4px，并排看就是
   右边矮一截。这里把控件组钉成 34px 并去掉上下内边距，让 30px 的按钮居中；
   左右内边距保持原样，组的宽度与文字留白不变。 */
.view-controls { gap: 2px; height: 34px; padding-top: 0; padding-bottom: 0; }

/* ===== domain-resume-content.mjs ===== */
/**
 * Editable resume content owned by one resume document.
 *
 * `columns` are positional fields. Work and project entries use three fields;
 * education has one section-level three-field row with a fixed 1:3:1 ratio,
 * followed by its own section-level bullets. Editable text is stored as an
 * HTML fragment in an `html` property. The supported tags are b, strong, and br.
 */

const SECTION_ORDER = Object.freeze([
  "skills",
  "work",
  "projects",
  "education",
]);

const EDUCATION_COLUMN_RATIO = Object.freeze([1, 3, 1]);

const SECTION_TITLES = Object.freeze({
  skills: "专业技能",
  work: "工作经历",
  projects: "项目经历",
  education: "教育背景",
});

const OPTIONAL_LINK_TYPES = Object.freeze({
  github: "github",
  personalWebsite: "personalWebsite",
});

const text = (html = "") => ({ html });
const isRecord = (value) => value !== null && typeof value === "object" && !Array.isArray(value);

/** Return a fresh, blank content document. No nested state is shared. */
function createEmptyResumeContent() {
  return {
    identity: {
      name: text(),
      contacts: {
        phone: text(),
        email: text(),
        wechat: text(),
      },
      links: {
        github: null,
        personalWebsite: null,
      },
    },
    sections: [
      { type: "skills", title: text(SECTION_TITLES.skills), bullets: [] },
      { type: "work", title: text(SECTION_TITLES.work), entries: [] },
      { type: "projects", title: text(SECTION_TITLES.projects), entries: [] },
      {
        type: "education",
        title: text(SECTION_TITLES.education),
        columns: [text(), text(), text()],
        bullets: [],
      },
    ],
  };
}

/**
 * Starting layout for the prototype document (9.98pt body text, slack 0.085,
 * one A4 page with only a hair of room to spare).
 *
 * The prototype is an ordinary direction: opening it runs fitResumeLayout and
 * overwrites this with the real measurement. The pinned numbers only exist so
 * the very first paint — the direction-room thumbnail of a store that has just
 * been seeded — matches the editor instead of spilling at the 10.5pt default.
 * If the sample content changes, re-measure and update both fields.
 */
const SAMPLE_LAYOUT = Object.freeze({
  bodyPt: 9.98,
  slack: 0.085,
});

/**
 * Normalize a user-typed link into a value that is safe to store and to
 * render as a clickable link.
 *
 * D-03 allows a link row to exist before it is filled in, so an empty value
 * is a legitimate intermediate state and stays empty. Anything the user
 * types without a scheme gets `https://` so L-04 keeps the printed link
 * clickable. Script-bearing schemes are refused outright: the paper renders
 * the href on an <a>, so `javascript:` would be an injection vector.
 *
 * @param {string} raw
 * @returns {string} '' or an absolute http(s) URL
 */
function normalizeLinkHref(raw) {
  const text = String(raw ?? "").trim();
  if (!text) return "";
  if (/^(?:javascript|data|vbscript|file|blob):/i.test(text)) return "";
  if (/^https?:\/\//i.test(text)) return text;
  if (text.startsWith("//")) return `https:${text}`;
  if (/\s/.test(text)) return "";
  return `https://${text}`;
}

/**
 * Repair a resume content document so it can always be rendered and edited.
 *
 * The strict validator exists to protect the data model, but it must never be
 * used to *discard* a stored direction: dropping it would let the next save
 * overwrite the user's real content with an empty template. Instead this
 * function repairs what is safely repairable (missing sections, missing
 * arrays, missing ids, link schemes) and keeps everything else verbatim.
 *
 * @param {unknown} content
 * @returns {{content: object, repaired: boolean, issues: string[]}}
 */
function repairResumeContent(content) {
  const issues = [];
  const base = createEmptyResumeContent();
  if (!isRecord(content)) {
    issues.push("content 不是对象，已重置为空白简历。");
    return { content: base, repaired: true, issues };
  }

  const out = base;
  const identity = isRecord(content.identity) ? content.identity : {};
  const contacts = isRecord(identity.contacts) ? identity.contacts : {};
  for (const key of ["phone", "email", "wechat"]) {
    const value = contacts[key];
    if (isRecord(value)) out.identity.contacts[key] = { html: String(value.html ?? ""), ...(value.align ? { align: value.align } : {}) };
  }
  const name = identity.name;
  if (isRecord(name)) out.identity.name = { html: String(name.html ?? ""), ...(name.align ? { align: name.align } : {}) };

  const links = isRecord(identity.links) ? identity.links : {};
  for (const [key, expectedType] of Object.entries(OPTIONAL_LINK_TYPES)) {
    const link = links[key];
    if (link === null || link === undefined) { out.identity.links[key] = null; continue; }
    if (!isRecord(link)) {
      issues.push(`identity.links.${key} 结构不完整，已移除该链接。`);
      out.identity.links[key] = null;
      continue;
    }
    const rawHref = typeof link.href === "string" ? link.href : "";
    const href = normalizeLinkHref(rawHref);
    if (rawHref && !href) issues.push(`identity.links.${key} 的地址无法识别，已清空该链接。`);
    else if (rawHref && href !== rawHref) issues.push(`identity.links.${key} 的地址已补全协议。`);
    const label = isRecord(link.label) ? { html: String(link.label.html ?? "") } : { html: "" };
    out.identity.links[key] = { type: expectedType, href, label, ...(link.align ? { align: link.align } : {}) };
  }

  const seenIds = new Set();
  const takeId = (id, fallback) => {
    let next = typeof id === "string" && id.trim() ? id.trim() : fallback;
    while (seenIds.has(next)) next = `${next}-${Math.random().toString(36).slice(2, 7)}`;
    seenIds.add(next);
    return next;
  };
  const repairBullets = (bullets, prefix) => {
    if (!Array.isArray(bullets)) { if (bullets !== undefined) issues.push(`${prefix}.bullets 不是数组，已置空。`); return []; }
    return bullets.map((bullet, index) => {
      if (!isRecord(bullet)) return { id: takeId(null, `${prefix}-bullet-${index + 1}`), html: "" };
      return {
        id: takeId(bullet.id, `${prefix}-bullet-${index + 1}`),
        html: String(bullet.html ?? ""),
        ...(bullet.align ? { align: bullet.align } : {}),
      };
    });
  };
  const repairColumns = (columns) => {
    const list = Array.isArray(columns) ? columns : [];
    return [0, 1, 2].map((index) => {
      const column = list[index];
      if (!isRecord(column)) return { html: "" };
      return { html: String(column.html ?? ""), ...(column.align ? { align: column.align } : {}) };
    });
  };

  const sections = Array.isArray(content.sections) ? content.sections : [];
  const byType = new Map();
  for (const section of sections) if (isRecord(section)) byType.set(section.type, section);
  SECTION_ORDER.forEach((type, index) => {
    const source = byType.get(type);
    const target = out.sections[index];
    if (!source) { issues.push(`缺少 ${type} 板块，已补空板块。`); return; }
    if (isRecord(source.title)) target.title = { html: String(source.title.html ?? ""), ...(source.title.align ? { align: source.title.align } : {}) };
    if (type === "skills") target.bullets = repairBullets(source.bullets, `sections[${index}]`);
    else if (type === "education") {
      target.columns = repairColumns(source.columns);
      target.bullets = repairBullets(source.bullets, `sections[${index}]`);
    } else {
      const entries = Array.isArray(source.entries) ? source.entries : [];
      target.entries = entries.map((entry, entryIndex) => {
        if (!isRecord(entry)) return { id: takeId(null, `${type}-entry-${entryIndex + 1}`), columns: repairColumns([]), bullets: [] };
        return {
          id: takeId(entry.id, `${type}-entry-${entryIndex + 1}`),
          columns: repairColumns(entry.columns),
          bullets: repairBullets(entry.bullets, `sections[${index}].entries[${entryIndex}]`),
        };
      });
    }
  });

  return { content: out, repaired: issues.length > 0, issues };
}

/**
 * Validate a resume content document.
 *
 * Returns `{ valid, errors }`; each error names the field path that needs
 * attention. This validates content shape without imposing a persistence or
 * snapshot format.
 */
function validateResumeContent(content) {
  const errors = [];
  const seenIds = new Map();

  if (!isRecord(content)) {
    return { valid: false, errors: ["content must be an object."] };
  }

  validateIdentity(content.identity, errors);

  if (!Array.isArray(content.sections)) {
    errors.push('sections must be an array ordered as "skills", "work", "projects", "education".');
  } else {
    if (content.sections.length !== SECTION_ORDER.length) {
      errors.push(`sections must contain exactly ${SECTION_ORDER.length} blocks in the fixed order.`);
    }

    SECTION_ORDER.forEach((expectedType, index) => {
      const section = content.sections[index];
      const path = `sections[${index}]`;

      if (!isRecord(section)) {
        errors.push(`${path} must be an object of type "${expectedType}".`);
        return;
      }

      if (section.type !== expectedType) {
        errors.push(`${path}.type must be "${expectedType}"; received ${describe(section.type)}.`);
      }
      validateHtmlField(section.title, `${path}.title`, errors);

      if (expectedType === "skills") {
        validateBullets(section.bullets, `${path}.bullets`, errors, seenIds);
      } else if (expectedType === "work" || expectedType === "projects") {
        validateExperienceEntries(section.entries, `${path}.entries`, errors, seenIds);
      } else {
        validateColumns(section.columns, `${path}.columns`, errors);
        validateBullets(section.bullets, `${path}.bullets`, errors, seenIds);
      }
    });
  }

  return { valid: errors.length === 0, errors };
}

function validateIdentity(identity, errors) {
  if (!isRecord(identity)) {
    errors.push("identity must be an object containing name, contacts, and links.");
    return;
  }

  validateHtmlField(identity.name, "identity.name", errors);

  if (!isRecord(identity.contacts)) {
    errors.push("identity.contacts must be an object containing phone, email, and wechat fields.");
  } else {
    for (const key of ["phone", "email", "wechat"]) {
      validateHtmlField(identity.contacts[key], `identity.contacts.${key}`, errors);
    }
  }

  if (!isRecord(identity.links)) {
    errors.push("identity.links must be an object; github and personalWebsite may each be null or a typed link.");
    return;
  }

  for (const [key, expectedType] of Object.entries(OPTIONAL_LINK_TYPES)) {
    const link = identity.links[key];
    if (link === null || link === undefined) continue;

    const path = `identity.links.${key}`;
    if (!isRecord(link)) {
      errors.push(`${path} must be null or an object with type "${expectedType}", href, and label.`);
      continue;
    }
    if (link.type !== expectedType) {
      errors.push(`${path}.type must be "${expectedType}"; received ${describe(link.type)}.`);
    }
    // 链接未填完时 href 为空串是合法中间态（D-03：填写状态删除键正常删字，
    // 文字空后再次退格才移除）。一旦填了内容，就必须是可点击的 http(s) 地址
    // （L-04），否则纸面上会渲染出点不动的链接。
    if (typeof link.href !== "string") {
      errors.push(`${path}.href must be a string.`);
    } else if (link.href !== "" && !isHttpUrl(link.href)) {
      errors.push(`${path}.href must be a valid http or https URL string.`);
    }
    validateAlignment(link.align, `${path}.align`, errors);
    validateHtmlField(link.label, `${path}.label`, errors);
  }
}

function validateExperienceEntries(entries, path, errors, seenIds) {
  if (!Array.isArray(entries)) {
    errors.push(`${path} must be an array of experience entries.`);
    return;
  }

  entries.forEach((entry, index) => {
    const entryPath = `${path}[${index}]`;
    if (!isRecord(entry)) {
      errors.push(`${entryPath} must be an object with id, three columns, and a bullets array.`);
      return;
    }
    validateId(entry.id, `${entryPath}.id`, errors, seenIds);
    validateColumns(entry.columns, `${entryPath}.columns`, errors);
    validateBullets(entry.bullets, `${entryPath}.bullets`, errors, seenIds);
  });
}

function validateColumns(columns, path, errors) {
  if (!Array.isArray(columns) || columns.length !== 3) {
    errors.push(`${path} must be an array containing exactly 3 HTML fields.`);
    return;
  }
  columns.forEach((column, index) => validateHtmlField(column, `${path}[${index}]`, errors));
}

function validateBullets(bullets, path, errors, seenIds) {
  if (!Array.isArray(bullets)) {
    errors.push(`${path} must be an array of bullets.`);
    return;
  }

  bullets.forEach((bullet, index) => {
    const bulletPath = `${path}[${index}]`;
    if (!isRecord(bullet)) {
      errors.push(`${bulletPath} must be an object with a unique id and an html string.`);
      return;
    }
    validateId(bullet.id, `${bulletPath}.id`, errors, seenIds);
    validateHtmlString(bullet.html, `${bulletPath}.html`, errors);
    validateAlignment(bullet.align, `${bulletPath}.align`, errors);
  });
}

function validateId(id, path, errors, seenIds) {
  if (typeof id !== "string" || id.trim() === "") {
    errors.push(`${path} must be a non-empty string.`);
    return;
  }
  const previousPath = seenIds.get(id);
  if (previousPath) {
    errors.push(`${path} duplicates id ${JSON.stringify(id)} already used at ${previousPath}.`);
  } else {
    seenIds.set(id, path);
  }
}

function validateHtmlField(value, path, errors) {
  if (!isRecord(value)) {
    errors.push(`${path} must be an object with an html string.`);
    return;
  }
  validateHtmlString(value.html, `${path}.html`, errors);
  validateAlignment(value.align, `${path}.align`, errors);
}

function validateAlignment(value, path, errors) {
  if (value !== undefined && !["left", "center", "right"].includes(value)) {
    errors.push(`${path} must be "left", "center", or "right" when provided.`);
  }
}

function validateHtmlString(value, path, errors) {
  if (typeof value !== "string") {
    errors.push(`${path} must be a string HTML fragment.`);
    return;
  }

  const remaining = value.replace(/<\/?(?:b|strong)>|<br\s*\/?>/gi, "");
  if (/[<>]/.test(remaining)) {
    errors.push(`${path} may contain text and only <b>, <strong>, or <br> tags.`);
  }
}

function isHttpUrl(value) {
  try {
    const url = new URL(value);
    return url.protocol === "http:" || url.protocol === "https:";
  } catch {
    return false;
  }
}

function describe(value) {
  return value === undefined ? "missing" : JSON.stringify(value);
}

/* ===== domain-auto-layout.mjs ===== */
const SLACK_SEARCH_TOLERANCE = 1e-6;

/**
 * Return the formula-driven line heights and gaps from SPEC L-19, in points.
 * The fixed 18.5px contact-to-first-section distance is outside this model.
 *
 * @param {number} bodyPt Body font size in points.
 * @param {number} slack Shared spacing looseness from 0 (tightest) to 1.
 */
function calculateSpacing(bodyPt, slack) {
  if (!Number.isFinite(bodyPt) || bodyPt <= 0) {
    throw new RangeError("bodyPt must be a finite positive number");
  }
  if (!Number.isFinite(slack) || slack < 0 || slack > 1) {
    throw new RangeError("slack must be a finite number between 0 and 1");
  }

  return {
    bodyLineHeightPt: bodyPt * (1.36 + 0.06 * slack),
    threeColumnTitleLineHeightPt: (bodyPt + 0.5) * (1.22 + 0.03 * slack),
    sameGroupBulletGapPt: 0.22 * bodyPt * (1 + 0.25 * slack),
    sectionBeforeGapPt: 0.60 * bodyPt * (1 + 0.30 * slack),
    largeTitleToFirstBulletGapPt: 0.40 * bodyPt * (1 + 0.15 * slack),
    largeTitleToFirstThreeColumnGapPt: 0.44 * bodyPt * (1 + 0.15 * slack),
    previousExperienceBulletToNextThreeColumnGapPt:
      0.60 * bodyPt * (1 + 0.30 * slack),
    threeColumnToFirstBulletGapPt: 0.24 * bodyPt * (1 + 0.10 * slack),
  };
}

/**
 * Find the largest body size that fits at minimum spacing, then the largest
 * spacing looseness that still fits at that size. Content measurement is
 * supplied by the caller because the production app measures real DOM layout.
 *
 * @param {object} options
 * @param {(input: {bodyPt: number, slack: number, spacing: ReturnType<typeof calculateSpacing>}) => number} options.measureContentHeightPx
 * @param {number} options.availableHeightPx
 * @param {number} [options.minBodyPt=8.5]
 * @param {number} [options.maxBodyPt=10.5]
 * @param {number} [options.bodyStepPt=0.01]
 */
function fitResumeLayout({
  measureContentHeightPx,
  availableHeightPx,
  minBodyPt = 8.5,
  maxBodyPt = 10.5,
  bodyStepPt = 0.01,
}) {
  if (typeof measureContentHeightPx !== "function") {
    throw new TypeError("measureContentHeightPx must be a function");
  }
  if (!Number.isFinite(availableHeightPx) || availableHeightPx < 0) {
    throw new RangeError("availableHeightPx must be a finite non-negative number");
  }
  if (!Number.isFinite(minBodyPt) || minBodyPt <= 0) {
    throw new RangeError("minBodyPt must be a finite positive number");
  }
  if (!Number.isFinite(maxBodyPt) || maxBodyPt < minBodyPt) {
    throw new RangeError("maxBodyPt must be finite and greater than or equal to minBodyPt");
  }
  if (!Number.isFinite(bodyStepPt) || bodyStepPt <= 0) {
    throw new RangeError("bodyStepPt must be a finite positive number");
  }

  const measuredHeights = new Map();
  const measure = (bodyPt, slack) => {
    const key = `${bodyPt}:${slack}`;
    if (measuredHeights.has(key)) return measuredHeights.get(key);

    const height = measureContentHeightPx({
      bodyPt,
      slack,
      spacing: calculateSpacing(bodyPt, slack),
    });
    if (!Number.isFinite(height) || height < 0) {
      throw new RangeError("measureContentHeightPx must return a finite non-negative height");
    }
    measuredHeights.set(key, height);
    return height;
  };

  const result = (bodyPt, slack, height) => {
    const fits = height <= availableHeightPx;
    return {
      status: fits ? "fits" : "overflow",
      bodyPt,
      slack,
      spacing: calculateSpacing(bodyPt, slack),
      height,
      availableHeightPx,
      fits,
      overflow: !fits,
      overflowPx: Math.max(0, height - availableHeightPx),
    };
  };

  // L-19 first tries the largest size with the tightest spacing. A short
  // resume keeps this exact layout; its gaps are never stretched to fill paper.
  const maxHeight = measure(maxBodyPt, 0);
  if (maxHeight <= availableHeightPx) return result(maxBodyPt, 0, maxHeight);

  let bodyPt;
  let bodyHeight;
  for (const candidate of descendingBodySizes(maxBodyPt, minBodyPt, bodyStepPt)) {
    const height = measure(candidate, 0);
    if (height <= availableHeightPx) {
      bodyPt = candidate;
      bodyHeight = height;
      break;
    }
  }

  // At minimum size and minimum spacing, keep the full measured content and
  // report overflow so the caller can pause PDF and ask for edits.
  if (bodyPt === undefined) return result(minBodyPt, 0, measure(minBodyPt, 0));

  const heightAtFullSlack = measure(bodyPt, 1);
  if (heightAtFullSlack <= availableHeightPx) {
    return result(bodyPt, 1, heightAtFullSlack);
  }

  // Content height is expected to grow as spacing loosens. Keep the known
  // fitting lower bound and narrow the boundary to 1e-6 slack precision.
  let fittingSlack = 0;
  let fittingHeight = bodyHeight;
  let overflowingSlack = 1;
  while (overflowingSlack - fittingSlack > SLACK_SEARCH_TOLERANCE) {
    const middleSlack = (fittingSlack + overflowingSlack) / 2;
    const height = measure(bodyPt, middleSlack);
    if (height <= availableHeightPx) {
      fittingSlack = middleSlack;
      fittingHeight = height;
    } else {
      overflowingSlack = middleSlack;
    }
  }

  return result(bodyPt, fittingSlack, fittingHeight);
}

function* descendingBodySizes(maxBodyPt, minBodyPt, bodyStepPt) {
  const range = maxBodyPt - minBodyPt;
  const wholeSteps = Math.floor(range / bodyStepPt + 1e-10);
  let lastCandidate = maxBodyPt;

  for (let index = 1; index <= wholeSteps; index += 1) {
    const rawCandidate = maxBodyPt - index * bodyStepPt;
    const candidate = Number(rawCandidate.toFixed(12));
    if (candidate <= minBodyPt) {
      yield minBodyPt;
      return;
    }
    yield candidate;
    lastCandidate = candidate;
  }

  if (Math.abs(lastCandidate - minBodyPt) > 1e-10) yield minBodyPt;
}

/* ===== domain-editor.mjs ===== */
// Pure editor-side business rules for resume directions and ordering.
//
// No DOM, no chrome.* APIs, no storage — safe to unit test in plain Node.
// These mirror the rules that still run inside sidepanel.mjs so the
// acceptance-critical behaviour (direction lifecycle, ordering, delete guard)
// has real coverage instead of relying on manual Chrome verification alone.

const DEFAULT_LAYOUT = Object.freeze({ marginsMm: { top: 9, right: 9, bottom: 9, left: 9 } });

// S-09：「原型」是一份真正的简历方向——同样的卡片、同样的编辑器、同样的
// 排版与打印，唯一不同是不允许删除。它的初始名字是「原型」，可以像其它方向
// 一样改名；因此用固定 id 认它，而不是认名字。
const PROTOTYPE_ID = 'direction-prototype';
const PROTOTYPE_NAME = '原型';

function clone(value) { return JSON.parse(JSON.stringify(value)); }

function uid(prefix = 'item') {
  const id = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  return `${prefix}-${id}`;
}

function nowIso() { return new Date().toISOString(); }

// S-03 / S-01: a direction owns one auto-saved current draft. The content and
// layout are deep-cloned so the new direction evolves independently of its
// template (modifying one never leaks into the other).
function makeDirection(name, content = createEmptyResumeContent(), currentLayout = DEFAULT_LAYOUT) {
  const createdAt = nowIso();
  return {
    id: uid('direction'),
    name: String(name || '我的简历').trim() || '我的简历',
    createdAt,
    currentDraft: { content: clone(content), layout: clone(currentLayout), updatedAt: createdAt },
  };
}

// The prototype document: same shape as any direction, seeded with the FDE
// sample. `builtin` only marks where it came from (so a future run can find it
// even if the id were ever repaired); it grants no other behaviour.

    // 重新渲染回到数据里的顺序即可（避免对 null 调用 splice 崩溃）。
    const list = findBulletList(state.section, ids[0]);
    if (!list) { scheduleFit(); scheduleSave(); return; }
    list.splice(0, list.length, ...reorderListById(ids, list));
  }
  // 不再 renderPaper()：拖动已通过 insertBefore 把真实 DOM 排好顺序，
  // 重建整页反而带来一次性大开销（销毁+重建全部 contenteditable）且让界面闪一下。
  // 只重新适配字号（scheduleFit）并防抖持久化（scheduleSave）。
  scheduleFit(); scheduleSave();
}
function setView(view) {
  currentView = view;
  elements.editor.classList.toggle('hidden', view !== 'editor');
  elements.directionView.classList.toggle('hidden', view !== 'directions');
  if (view !== 'editor') elements.sortHandle.hidden = true;
  if (view === 'directions') { renderDirections(); setTimeout(() => elements.directionSearch.focus(), 40); }
  else { updateSortHandle(); scheduleFit(); }
}
function renderDirections() {
  const query = elements.directionSearch.value.trim().toLowerCase();
  // S-07：方向室按最近编辑时间倒序。搜索只过滤、不改变相对顺序。
  // S-09：原型也是这个顺序里的一员，它不享有固定位置——唯一的不同只是不能删除。
  const directions = orderedDirections().filter((direction) => !query || direction.name.toLowerCase().includes(query));
  elements.directionGrid.replaceChildren(...directions.map(renderDirectionCard));
  updateCardScales();
}
function orderedDirections() {
  return [...storeState.directions].sort((a, b) => directionSortKey(b) - directionSortKey(a));
}
// 卡片缩略必须整份套用该方向自己的排版参数（字号 + 松紧度）：只写
// --body-size 会让行高与六处间距继续沿用 10.5pt 的默认值，同一份内容在
// 卡片里和编辑器里的疏密就对不上（S-07 要求缩略与编辑页一致）。
function cardLayoutOf(direction) {
  const stored = direction.currentDraft?.layout || DEFAULT_LAYOUT;
  const bodyPt = Number(stored.bodyPt);
  const slack = Number(stored.slack);
  return {
    bodyPt: Number.isFinite(bodyPt) && bodyPt > 0 ? bodyPt : 10.5,
    slack: Number.isFinite(slack) ? Math.min(1, Math.max(0, slack)) : 0,
  };
}
function renderDirectionCard(direction) {
  const article = document.createElement('article');
  article.className = 'library-card direction-card';
  article.dataset.directionId = direction.id;
  article.dataset.current = String(direction.id === activeDirection?.id);
  const meta = document.createElement('div'); meta.className = 'card-meta';
  const info = document.createElement('div'); info.className = 'card-info';
  const title = document.createElement('button');
  title.type = 'button'; title.className = 'card-name'; title.textContent = direction.name;
  title.dataset.renameDirection = direction.id; title.title = '点击修改方向名称';
  title.setAttribute('aria-label', `点击修改方向名称：${direction.name}`);
  info.append(title);
  const time = document.createElement('time');
  time.className = 'card-time'; time.dateTime = direction.currentDraft.updatedAt || '';
  time.textContent = fmtMinute(direction.currentDraft.updatedAt);
  info.append(time);
  meta.append(info);
  // S-09：原型与其它方向的唯一差别就是不能删除，所以它没有删除按钮。
  if (!isPrototypeDirection(direction)) {
    const actions = document.createElement('div'); actions.className = 'card-actions';
    const deleteButton = document.createElement('button');
    deleteButton.type = 'button'; deleteButton.dataset.deleteDirection = direction.id;
    deleteButton.setAttribute('aria-label', '删除方向'); deleteButton.title = '删除方向';
    deleteButton.textContent = '🗑️';
    actions.append(deleteButton); meta.append(actions);
  }
  article.append(meta);
  const frame = document.createElement('div');
  frame.className = 'card-paper-frame'; frame.dataset.openDirection = direction.id;
  frame.setAttribute('role', 'button'); frame.setAttribute('tabindex', '0');
  frame.setAttribute('aria-label', `打开${direction.name}`);

  const { bodyPt, slack } = cardLayoutOf(direction);
  applySpacing(bodyPt, slack, calculateSpacing(bodyPt, slack), mini);
  const inner = document.createElement('div'); inner.className = 'paper-content';
  buildPaperContent(inner, direction.currentDraft.content, false);
  mini.append(inner); frame.append(mini); article.append(frame);
  return article;
}
function updateCardScales() {
  if (currentView !== 'directions') return;
  elements.directionGrid.querySelectorAll('.card-paper-frame').forEach((frame) => {
    const mini = frame.querySelector('.card-paper');
    if (!mini) return;
    const scale = frame.clientWidth / PAPER_WIDTH_PX;
    mini.style.setProperty('--card-scale', String(scale));
    // S-07：缩略图至少显示完整 A4；超页正文则按实际内容向下延展，不裁切。
    // 用 offsetHeight（布局像素）而不是 getBoundingClientRect：后者被
    // transform:scale 缩过，量出来的是缩放后的视觉高度。
    const flow = mini.querySelector('.resume-flow');
    if (!flow) return;
    const paperPaddingPx = 2 * (9 / 25.4) * 96; // 上下各 9mm
    const naturalHeight = Math.max(PAPER_HEIGHT_PX, paperPaddingPx + flow.offsetHeight + 2);
    mini.style.height = `${naturalHeight.toFixed(2)}px`;
    frame.style.aspectRatio = 'auto';
    frame.style.height = `${(naturalHeight * scale).toFixed(2)}px`;
  });
}
async function openDirection(id) {
  const direction = findDirection(id); if (!direction) return;
  if (activeDirection?.id !== id && !(await saveNow())) return;
  resetEditorState(direction); renderPaper(); setView('editor'); scheduleFit(); await persistStore();}
function toggleDirections() { setView(currentView === 'directions' ? 'editor' : 'directions'); }
function openDialog(dialog) { if (!dialog.open) dialog.showModal(); }
function confirmAction(message, title = '请确认', actionText = '确认') {
  elements.confirmTitle.textContent = title; elements.confirmMessage.textContent = message; elements.confirmAction.textContent = actionText; openDialog(elements.confirmDialog);
  return new Promise((resolve) => {
    const done = () => { elements.confirmDialog.removeEventListener('close', done); resolve(elements.confirmDialog.returnValue === 'confirm'); };
    elements.confirmDialog.addEventListener('close', done);
  });
}
function openCreateDirection() {
  elements.directionName.value = '';
  // 模板下拉就是"现有方向"本身——原型也是一份普通方向，不必再单开一个
  // 特殊条目。清单顺序跟着方向室的最近编辑倒序走，但默认仍然选中「原型」：
  // 它是内置的起步模板，不该因为最近编辑的是别的方向就悄悄换掉默认值。
  const options = orderedDirections();
  elements.directionTemplate.replaceChildren(...options.map((direction) => {
    const option = document.createElement('option');
    option.value = direction.id; option.textContent = direction.name;
    return option;
  }));
  const preferred = options.find(isPrototypeDirection) || options[0];
  elements.directionTemplate.value = preferred?.id || '';
  openDialog(elements.directionDialog); elements.directionName.focus();
}
async function createDirection() {
  const name = elements.directionName.value.trim();
  if (!name) return;
  const templateValue = elements.directionTemplate.value;
  // 下拉里每一个选项都是一份真实方向；找不到时退回原型，避免"没选中"就
  // 建出一份空白简历。
  const source = findDirection(templateValue) || storeState.directions.find(isPrototypeDirection);
  if (!source) return;
  // 旧草稿保存失败不该阻塞新建：内容还在内存里，下一次编辑会重试落盘。
  // 之前这里 return 会让“创建”按钮看起来毫无反应。
  await saveNow().catch(() => false);
  const direction = makeDirection(name, source.currentDraft.content, source.currentDraft.layout);
  storeState.directions.push(direction); resetEditorState(direction);
  try { await persistStore(); } catch (error) { showToast(`已创建，但保存失败：${error.message}`, 'error'); }
  elements.directionDialog.close('created'); renderPaper(); setView('editor'); scheduleFit();}
function openRenameDirection(id) {
  const direction = findDirection(id); if (!direction) return;
  pendingRenameId = id; elements.renameName.value = direction.name; openDialog(elements.renameDialog); elements.renameName.focus(); elements.renameName.select();
}
async function renameDirection(name) {
  const direction = findDirection(pendingRenameId); pendingRenameId = null; if (!direction || !name.trim()) return;
  const value = name.trim(); if (value === direction.name) return;
  if (direction.id === activeDirection?.id) pushUndo(true);
  direction.name = value; if (direction.id === activeDirection?.id) elements.title.textContent = value;
  await persistStore(); if (currentView === 'directions') renderDirections();}
async function deleteDirection(id) {
  const direction = findDirection(id); if (!direction) return;
  if (isPrototypeDirection(direction)) { showToast('「原型」是内置简历，不能删除。', 'error'); return; }
  if (!canDeleteDirection(storeState.directions, id)) { showToast('至少要保留一份简历方向。', 'error'); return; }
  if (!await confirmAction(`“${direction.name}”会被永久删除，不能恢复。`, '删除简历方向', '删除')) return;
  const wasActive = activeDirection?.id === id;
  const index = storeState.directions.findIndex((item) => item.id === id);
  storeState.directions.splice(index, 1);
  if (wasActive) resetEditorState(storeState.directions[Math.min(index, storeState.directions.length - 1)]);
  await persistStore();
  if (wasActive) { renderPaper(); setView('editor'); scheduleFit(); }
  else renderDirections();
}
const PRINT_PAYLOAD_KEY = 'print-payload';
async function printPdf() {
  // PDF 是编辑器主动作。方向室视图下纸面是隐藏的（容器尺寸为 0）：此时测量
  // 只会得到垃圾结果，打印快照也会带上完全错误的布局，而用户看到的其实是
  // 方向室某张卡片、根本不是将要打印的那一页。先回到编辑页让用户确认内容，
  // 再点一次 PDF 才真正打印。
  if (currentView !== 'editor') {
    setView('editor');
    showToast('已返回编辑页，请再次点击 PDF 打印当前方向。');
    return;
  }
  // Re-measure immediately so a click made during the autosave debounce cannot
  // print a stale layout decision.
  applyAutoFit();
  if (exportBlockedReason) { showToast(exportBlockedReason, 'error'); return; }
  if (!(await saveNow())) return;
  // Chrome 侧边栏是受限渲染面，window.print() 不可靠（Chromium 已知缺陷）。
  // 改为把当前已适配好的纸面快照交给独立打印页，在真实标签页里打印：
  // 输出与侧边栏所见一致，A4 与 @media print 规则稳定生效。
  const paper = elements.paper.cloneNode(true);
  paper.querySelectorAll('[contenteditable]').forEach((element) => {
    element.removeAttribute('contenteditable');
    element.removeAttribute('data-edit');
    element.removeAttribute('data-placeholder');
  });
  // 空列表补充入口是编辑态控件，与 safe-zone/boundary 一样不进打印快照。
  paper.querySelectorAll('.safe-zone,.boundary,.empty-section-hint').forEach((element) => element.remove());
  paper.querySelectorAll('.selected').forEach((element) => element.classList.remove('selected'));
  paper.classList.remove('guide-on', 'is-overflow');
  try {
    await extensionStorageSet(PRINT_PAYLOAD_KEY, { html: paper.outerHTML, name: activeDirection?.name || '简历' });
    await chrome.tabs.create({ url: chrome.runtime.getURL('print.html') });
  } catch (error) {
    showToast(`打开打印页失败：${error.message}`, 'error');
  }
}
function installEvents() {
  elements.paperContent.addEventListener('keydown', onEditorKeydown);
  elements.paperContent.addEventListener('paste', onPaste);
  elements.paperContent.addEventListener('beforeinput', onBeforeInput);
  elements.paperContent.addEventListener('input', onInput);
  elements.paperContent.addEventListener('compositionstart', onCompositionStart);
  elements.paperContent.addEventListener('compositionend', onCompositionEnd);
  elements.paperContent.addEventListener('compositioncancel', onCompositionCancel);
  elements.paperContent.addEventListener('focusin', onFocusIn);
  elements.paperContent.addEventListener('focusout', onFocusOut);
  elements.paperContent.addEventListener('click', (event) => {
    const add = event.target.closest('[data-add-link]'); if (add) { event.preventDefault(); addLink(add.dataset.addLink); return; }
    if (event.target.closest('a[data-edit]')) event.preventDefault();
  });
  elements.title.addEventListener('click', () => openRenameDirection(activeDirection?.id));
  // 方向室入口：⌘O（SPEC P-03/S-07，原 ⌘F 于 2026-10-26 改为 ⌘O）与方向室内的"返回编辑"。
  // 顶栏按方向 A 设计稿只保留 PDF 一个主动作，不再放"方向室"按钮。
  byId('back-editor').addEventListener('click', () => setView('editor'));
  byId('create-direction').addEventListener('click', openCreateDirection);
  elements.directionSearch.addEventListener('input', renderDirections);
  elements.directionGrid.addEventListener('click', async (event) => {
    const rename = event.target.closest('[data-rename-direction]'); if (rename) { event.stopPropagation(); openRenameDirection(rename.dataset.renameDirection); return; }
    const remove = event.target.closest('[data-delete-direction]'); if (remove) { event.stopPropagation(); await deleteDirection(remove.dataset.deleteDirection); return; }
    const frame = event.target.closest('[data-open-direction]'); if (frame) await openDirection(frame.dataset.openDirection);
  });
  elements.directionGrid.addEventListener('keydown', async (event) => {
    if (!['Enter', ' '].includes(event.key)) return;
    const frame = event.target.closest('[data-open-direction]'); if (frame) { event.preventDefault(); await openDirection(frame.dataset.openDirection); }
  });
  elements.directionForm.addEventListener('submit', (event) => { event.preventDefault(); if (event.submitter?.value === 'cancel') return; createDirection().catch((error) => showToast(`新建失败：${error.message}`, 'error')); });
  elements.renameForm.addEventListener('submit', (event) => { if (event.submitter?.value === 'rename') { event.preventDefault(); const value = elements.renameName.value; elements.renameDialog.close('renamed'); renameDirection(value).catch((error) => showToast(`改名失败：${error.message}`, 'error')); } });
  elements.confirmForm.addEventListener('submit', (event) => { if (!event.submitter) { event.preventDefault(); elements.confirmDialog.close('cancel'); } });
  // 取消按钮是 type="button"（不做表单默认按钮），否则含单文本输入框的表单
  // 会按 WHATWG 隐式提交规则把第一个提交按钮当成 Enter 默认按钮——而取消键
  // 排在确认键前面，于是回车等于"取消"（#10）。type="button" 后需自行关弹窗。
  for (const dialog of [elements.directionDialog, elements.renameDialog, elements.confirmDialog]) {
    const cancel = dialog.querySelector('[value="cancel"]');
    if (cancel) cancel.addEventListener('click', () => dialog.close('cancel'));
  }
  byId('zoom-out').addEventListener('click', () => nudgeZoom(-2));
  byId('zoom-in').addEventListener('click', () => nudgeZoom(2));
  byId('zoom-readout').addEventListener('click', showZoomEditor);
  byId('zoom-input').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') { event.preventDefault(); hideZoomEditor(true); }
    else if (event.key === 'Escape') { event.preventDefault(); hideZoomEditor(false); }
  });
  byId('zoom-input').addEventListener('blur', () => hideZoomEditor(true));
  byId('toggle-guide').addEventListener('click', () => { showGuide = !showGuide; elements.paper.classList.toggle('guide-on', showGuide); byId('toggle-guide').setAttribute('aria-pressed', String(showGuide)); });
  elements.export.addEventListener('click', printPdf);

  window.addEventListener('scroll', updateSortHandle, true);

    if (document.visibilityState === 'hidden') saveNow().catch(() => {});
  });
  window.addEventListener('pagehide', () => {
    saveNow().catch(() => {});
  });
  window.addEventListener('keydown', async (event) => {
    const key = event.key.toLowerCase();
    if (event.metaKey && key === 's') { event.preventDefault(); return; }
    if ((event.metaKey || event.ctrlKey) && key === 'o' && !elements.directionDialog.open && !elements.renameDialog.open && !elements.confirmDialog.open) { event.preventDefault(); toggleDirections(); return; }
    if (event.metaKey && key === 'z') { event.preventDefault(); if (!event.shiftKey) await undo(); return; }
    if (event.metaKey && ['i', 'u'].includes(key)) { event.preventDefault(); return; }
    if (event.key === 'Escape' && !elements.directionDialog.open && !elements.renameDialog.open && !elements.confirmDialog.open) {

    }

}
function installDragObservers() {
  new ResizeObserver(updateViewScale).observe(elements.paperScroller);
  new ResizeObserver(updateCardScales).observe(elements.directionGrid);
  installDrag();
}
async function boot() {
  installEvents(); installDragObservers();
  checkRequiredFonts();
  try {
    await loadStore();
    const direction = findDirection(storeState.lastOpenedDirectionId) || storeState.directions[0];
    resetEditorState(direction); renderPaper();    requestAnimationFrame(() => { applyAutoFit(); updateViewScale(); });
  } catch (error) {
    // 打开失败时必须留一个可用的内存态：storeState 若为 null，
    // 后续"新建方向"会在 storeState.directions.push 上抛 TypeError，
    // 用户就彻底卡死在一个打不开也建不了新简历的状态里。
    if (!storeState) storeState = initialState();
    showToast(`简历没有打开，已新建一份空白简历。原因：${error.message}`, 'error');

    resetEditorState(fallback); renderPaper();
    requestAnimationFrame(() => { applyAutoFit(); updateViewScale(); });
  }
}

boot();
